name: VakitPlus ZIP'i Aç

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAKITPLUS_TOKEN }}

      - name: En yeni VakitPlus ZIP dosyasını bul ve aç
        shell: bash
        run: |
          set -e

          ZIP="$(find . -maxdepth 1 -type f -name 'VakitPlus-*.zip' -printf '%T@ %p\n' \
            | sort -nr \
            | head -n 1 \
            | cut -d' ' -f2-)"

          if [ -z "$ZIP" ]; then
            echo "VakitPlus ZIP dosyası bulunamadı."
            exit 1
          fi

          echo "Kullanılacak ZIP: $ZIP"

          rm -rf /tmp/vakitplus
          mkdir -p /tmp/vakitplus

          unzip -q "$ZIP" -d /tmp/vakitplus

          if [ -d "/tmp/vakitplus/VakitPlus" ]; then
            SRC="/tmp/vakitplus/VakitPlus"
          else
            SRC="/tmp/vakitplus"
          fi

          cp -a "$SRC"/. .

          echo "VakitPlus projesi başarıyla yerleştirildi."

      - name: Değişiklikleri GitHub'a gönder
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Vakit+ V2.5.1 JVM düzeltmesini uygula" || echo "Commit edilecek yeni değişiklik yok."
          git push
