name: VakitPlus ZIP'i Aç

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi al
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.VAKITPLUS_TOKEN }}

      - name: ZIP'i aç
        run: |
          mkdir -p /tmp/vakitplus
          unzip -q "VakitPlus-FINAL-CLOUD-BUILD-2.zip" -d /tmp/vakitplus

          if [ -d "/tmp/vakitplus/VakitPlus" ]; then
            cp -a /tmp/vakitplus/VakitPlus/. .
          else
            cp -a /tmp/vakitplus/. .
          fi

          rm -f "VakitPlus-FINAL-CLOUD-BUILD-2.zip"

      - name: Projeyi GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git diff --cached --quiet || git commit -m "Vakit+ final proje dosyalarını çıkar"

          git fetch origin
          git rebase "origin/${{ github.ref_name }}"

          git push origin "HEAD:${{ github.ref_name }}"
