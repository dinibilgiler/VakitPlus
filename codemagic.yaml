workflows:
  android-release:
    name: Vakit+ Android Release
    max_build_duration: 60
    environment:
      java: 21
    scripts:
      - name: Release APK
        script: |
          gradle assembleRelease
    artifacts:
      - app/build/outputs/apk/release/*.apk
      - app/build/outputs/mapping/release/mapping.txt
